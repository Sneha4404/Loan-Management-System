<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Loans</title>

    <link rel="stylesheet" href="css/my-loans.css">
</head>
<body>

    <div class="container">

        <h1>My Loan Applications</h1>
        <input
        type="text"
        id="searchInput"
        placeholder="Search by Name or Loan Type..."
>

        <table id="loanTable">

            <thead>
                <tr>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Loan Type</th>
                    <th>Loan Amount</th>
                    <th>Duration</th>
                    <th>Annual Income</th>
                    <th>Purpose</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

    <script src="js/my-loans.js"></script>

</body>
</html>
